<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Shell</title>
<style>body{font-family:Arial;background:#111827;color:white;text-align:center;padding:20px}main{max-width:560px;margin:auto;background:#1f2937;padding:20px;border-radius:16px}video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:10px;margin:8px;font-weight:bold}#status{padding:10px;background:#374151;border-radius:8px}</style>
</head><body><main><h2>Camera Shell Psikotes</h2><p>Izinkan kamera, lalu klik Ambil Foto.</p><video id="video" autoplay playsinline muted></video><div id="status">Memulai kamera...</div><button id="cap" onclick="capture()">Ambil Foto</button><button onclick="window.close()">Tutup</button></main>
<script>
let stream=null;
async function init(){if(!window.isSecureContext){status('Harus dibuka melalui HTTPS, bukan file://');return}if(!navigator.mediaDevices?.getUserMedia){status('Browser tidak mendukung akses kamera.');return}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;status('Kamera aktif. Pastikan wajah terlihat jelas.')}
catch(e){status('Kamera gagal: '+e.name+' — '+e.message)}
}
function capture(){if(!stream){status('Kamera belum aktif.');return}const c=document.createElement('canvas'),v=video,scale=Math.min(1,800/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',.82);if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'PSIKOTES_CAMERA_RESULT',dataUrl},'*');status('Foto dikirim ke halaman Psikotes.');cap.disabled=true}else status('Halaman Psikotes utama tidak ditemukan.')}
function status(t){document.getElementById('status').textContent=t}addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));init();
</script></body></html>
