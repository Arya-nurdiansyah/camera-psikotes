<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Shell Psikotes v2.1</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#1f2937;color:white;margin:0;padding:16px;text-align:center}.box{max-width:540px;margin:auto;background:#111827;border-radius:16px;padding:20px}h1{font-size:24px}video,img{width:100%;border-radius:12px;background:#000;display:block}img{margin-top:12px}button{padding:12px 18px;border:0;border-radius:10px;margin:8px 4px;cursor:pointer;font-weight:bold}#captureBtn{background:#2563eb;color:white}#sendBtn{background:#16a34a;color:white}#closeBtn{background:#e5e7eb;color:#111827}button:disabled{background:#6b7280;color:#ddd;cursor:not-allowed}.status{padding:12px;border-radius:10px;background:#374151;margin:12px 0;min-height:44px}.ok{background:#166534}.err{background:#991b1b}.warn{background:#92400e}.hidden{display:none}.small{font-size:12px;color:#cbd5e1}</style></head><body><div class="box"><h1>Camera Shell Psikotes</h1><p>Izinkan kamera, ambil foto, lalu klik Kirim Foto.</p><video id="videoEl" autoplay playsinline muted></video><div id="statusEl" class="status">Memulai kamera...</div><button id="captureBtn" disabled>Ambil Foto</button><button id="sendBtn" disabled>Kirim Foto</button><button id="closeBtn">Tutup</button><img id="previewEl" class="hidden" alt="Preview foto"><p class="small">Jangan menutup jendela ini sebelum foto berhasil dikirim dan diterima halaman Psikotes.</p></div><script>
let stream=null,photoDataUrl=null;const videoEl=document.getElementById('videoEl'),statusEl=document.getElementById('statusEl'),captureBtn=document.getElementById('captureBtn'),sendBtn=document.getElementById('sendBtn'),closeBtn=document.getElementById('closeBtn'),previewEl=document.getElementById('previewEl');
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status '+type;}
async function initCamera(){if(!window.isSecureContext){setStatus('Camera Shell harus dibuka melalui HTTPS, bukan file://.','err');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Browser tidak mendukung akses kamera.','err');return}try{setStatus('Meminta izin kamera...','warn');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});videoEl.srcObject=stream;await videoEl.play();captureBtn.disabled=false;setStatus('Kamera aktif. Pastikan wajah terlihat jelas lalu klik Ambil Foto.','ok')}catch(e){setStatus('Kamera gagal: '+e.name+' — '+e.message,'err')}}
function capturePhoto(){if(!stream||!videoEl.videoWidth){setStatus('Kamera belum siap.','err');return}const canvas=document.createElement('canvas'),scale=Math.min(1,900/videoEl.videoWidth);canvas.width=Math.round(videoEl.videoWidth*scale);canvas.height=Math.round(videoEl.videoHeight*scale);canvas.getContext('2d').drawImage(videoEl,0,0,canvas.width,canvas.height);photoDataUrl=canvas.toDataURL('image/jpeg',0.82);previewEl.src=photoDataUrl;previewEl.classList.remove('hidden');sendBtn.disabled=false;setStatus('Foto berhasil diambil. Periksa preview lalu klik Kirim Foto.','ok')}
function sendPhoto(){if(!photoDataUrl){setStatus('Belum ada foto.','err');return}if(!window.opener||window.opener.closed){setStatus('Halaman Psikotes utama tidak ditemukan. Buka Camera Shell dari tombol di halaman Psikotes.','err');return}try{window.opener.postMessage({type:'PSIKOTES_CAMERA_RESULT',dataUrl:photoDataUrl},'*');sendBtn.disabled=true;setStatus('Foto dikirim. Menunggu konfirmasi dari halaman Psikotes...','warn')}catch(e){setStatus('Gagal mengirim foto: '+e.message,'err')}}
window.addEventListener('message',event=>{const data=event.data||{};if(data.type!=='PSIKOTES_CAMERA_ACK')return;if(data.ok){setStatus('✓ Foto sudah diterima dan disimpan oleh halaman Psikotes.','ok');captureBtn.disabled=true;sendBtn.disabled=true}else{sendBtn.disabled=false;setStatus('✕ Penyimpanan gagal: '+(data.message||'Error tidak diketahui.'),'err')}});
captureBtn.addEventListener('click',capturePhoto);sendBtn.addEventListener('click',sendPhoto);closeBtn.addEventListener('click',()=>{stopCamera();window.close()});function stopCamera(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}}window.addEventListener('beforeunload',stopCamera);initCamera();
</script></body></html>
